name: Nervana Systems
description: >-
  Nervana Systems was a deep-learning and AI-hardware startup founded in 2014 (founders Naveen
  Rao, Amir Khosrowshahi, and Arjun Bansal) that built the open-source "neon" deep-learning
  framework and a custom AI training ASIC (the Nervana Engine). Backed by DCVC (Data Collective)
  and others, the company was acquired by Intel in August 2016 and folded into Intel's AI effort,
  where its work became the Intel Nervana Neural Network Processor (NNP-T / NNP-I); Intel wound
  that product line down in early 2020 following its Habana Labs acquisition. Nervana Systems no
  longer exists as an independent entity and publishes no live developer surface: its primary
  domains (nervanasys.com, nervana.com, nervanasystems.com) no longer resolve, and it is not
  present in the APIs.io catalog. This profile is retained as a historical VC-portfolio lead.
